name: Q3
on:
  push:
    paths:
      - 'Q3.java'
      - '.github/workflows/Q3.yaml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Créer Q3_archive_java.txt
        run: |
          echo "AMPEAU Samuel" > Q3_archive_java.txt
          echo "----- Q3.java -----" >> Q3_archive_java.txt
          cat Q3.java >> Q3_archive_java.txt
          cat Q3_archive_java.txt

      - name: Commit et push
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git add Q3_archive_java.txt
          git diff --cached --quiet && { echo "Rien de nouveau"; exit 0; }
          git commit -m "Q3 : archive de Q3.java"
          git pull --rebase
          git push
